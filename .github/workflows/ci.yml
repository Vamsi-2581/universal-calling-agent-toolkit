name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest
      - run: uv run --python ${{ matrix.python }} mypy

  examples-and-packaging:
    runs-on: ubuntu-latest
    needs: [typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: Build TypeScript package
        working-directory: packages/typescript
        run: npm ci && npm run build
      - name: Run examples
        run: |
          node examples/typescript/end-to-end.mjs
          (cd packages/python && uv sync && uv run python ../../examples/python/end_to_end.py)
      - name: Install npm tarball into a clean project
        run: |
          tarball=$(cd packages/typescript && npm pack --silent)
          mkdir /tmp/consumer && cd /tmp/consumer && npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE/packages/typescript/$tarball"
          node --input-type=module -e "for (const s of ['', '/twilio', '/plivo', '/telnyx', '/vonage', '/deepgram']) await import('@vasikmansuri/calling-agent-toolkit' + s)"
      - name: Install wheel into a clean venv
        run: |
          (cd packages/python && uv build)
          uv venv /tmp/pyconsumer
          uv pip install --python /tmp/pyconsumer/bin/python packages/python/dist/*.whl
          /tmp/pyconsumer/bin/python -I -c "import calling_agent_toolkit.providers.twilio, calling_agent_toolkit.rag, calling_agent_toolkit.email_capture"
