[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "calling-agent-toolkit"
version = "0.0.0"
description = "Provider-neutral telephony, audio, email-capture, STT and RAG building blocks for existing AI calling agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Private :: Do Not Upload",
  "Typing :: Typed",
]

[project.optional-dependencies]
# Heavy integrations stay optional. Each group is filled in by the phase that adds a verified adapter.
telephony = []
audio = []
stt = []
rag = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "jsonschema>=4.23",
  "mypy>=1.15",
  "langchain-core>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/calling_agent_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
files = ["src"]
