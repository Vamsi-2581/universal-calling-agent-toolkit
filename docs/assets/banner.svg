  <path d="M90 96c0-6 5-10 11-10h6c3 0 5 2 5 4v4c0 2-2 4-4 4h-3c-1 3-1 6 0 9h3c2 0 4 2 4 4v4c0 2-2 4-5 4h-6c-6 0-11-4-11-10z" fill="#0b0f17"/>

  <text x="148" y="112" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#e6edf7">Universal Calling Agent Toolkit</text>
  <text x="72" y="180" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#8a99b3">Telephony adapters · audio pipeline · email capture · STT · RAG</text>
  <text x="72" y="214" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#8a99b3">for the AI calling agent you already have.</text>

